<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talk Shop</title>
<meta name="description" content="商务英语口语练习：情景对话、60 秒挑战、救场短语库">
<meta name="theme-color" content="#2343D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Talk Shop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: one phone-width column; a chat-style practice room, bottom tab bar, highlighter marks on phrases worth keeping.
   System fonts only, so it loads fast everywhere (no external requests). */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#E8ECF4; --ink:#14213D; --muted:#5A6580; --line:#D9DFEA;
  --accent:#2343D4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FC;
  --mark:#FFE45C; --mark-ink:#1B1B12;
  --good:#1D7F54; --warn:#A86A12; --bad:#BC3B34;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1322; --surface:#161F35; --sunk:#1D2842; --ink:#E7EBF5; --muted:#98A3BE; --line:#28344F;
  --accent:#8195FF; --accent-ink:#0D1322; --accent-soft:#232F55;
  --mark:#E9CB3B; --mark-ink:#17150A;
  --good:#4CC28C; --warn:#E0A645; --bad:#F07A72; color-scheme:dark }}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
body.in-chat .app{padding-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand h1 span{background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 2px}
.topr{display:flex;align-items:center;gap:10px}
.streak{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.streak b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}

.notice{background:var(--sunk);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:14px}
.notice b{color:var(--ink)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 10px}

.today{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:16px;display:grid;gap:10px}
.today small{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.8;font-weight:600}
.today h2{font-size:20px}
.today p{margin:0;opacity:.88;font-size:14px}
.today button{justify-self:start;background:var(--accent-ink);color:var(--accent);font-weight:600;padding:9px 16px;border-radius:999px}
.scen{display:grid;gap:8px}
.scen button{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.scen .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center}
.scen .t{font-weight:600;font-size:15px}
.scen .s{font-size:13px;color:var(--muted)}
.scen .who{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.scen .done{color:var(--good);border-color:var(--good)}

.chathead{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-top:-8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chathead .ttl{flex:1;min-width:0}
.chathead .ttl h2{font-size:17px}
.chathead .ttl div{font-size:12px;color:var(--muted)}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0 14px;font-size:13.5px}
.brief summary{cursor:pointer;font-weight:600;font-size:13px}
.brief ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.phr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.phr .en{font-weight:500}
.phr .zh{font-size:12.5px;color:var(--muted);grid-column:1}
.phr .acts{grid-row:1/span 2;grid-column:2;display:flex;gap:4px}
.mini{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.mini:active{background:var(--sunk);color:var(--ink)}
.mini svg{width:17px;height:17px}
.mini.starred{color:var(--warn)}

.thread{display:grid;gap:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px}
.msg .who{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;justify-self:start}
.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px;justify-self:end;white-space:pre-wrap}
.me .who{color:inherit;opacity:.75;text-align:right}
.them .say{display:flex;gap:6px;align-items:flex-start}
.them .say p{margin:0;flex:1}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

.fb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.score{font-family:var(--f-mono);font-size:13px;padding:3px 9px;border-radius:999px;color:var(--surface);flex:none}
.score.hi{background:var(--good)}.score.mid{background:var(--warn)}.score.lo{background:var(--bad)}
.better{background:var(--sunk);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.better p{margin:0;font-weight:500}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip svg{width:14px;height:14px}
.chip.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.fixes{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.fixes s{color:var(--bad);text-decoration-thickness:1.5px}
.fixes b{color:var(--good);font-weight:600}
.fixes span{display:block;font-size:12.5px;color:var(--muted)}
mark{background:var(--mark);color:var(--mark-ink);padding:1px 4px;border-radius:4px}
.stats{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.checklist{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:3px}

.composer{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));margin-top:14px;display:grid;gap:8px;z-index:4}
.composer .box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;resize:none;padding:8px 6px;max-height:160px;min-height:40px}
.composer textarea:focus{outline:none}
.mic{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mic svg{width:22px;height:22px}
.mic.live{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(188,59,52,.45)}100%{box-shadow:0 0 0 12px rgba(188,59,52,0)}}
.send{width:46px;height:46px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.send:disabled{opacity:.4}
.hint{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.drillq{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.3}
.timer{display:flex;align-items:center;gap:14px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--sunk)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring text{font-family:var(--f-mono);font-size:22px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:999px;font-weight:600;background:var(--sunk);display:inline-flex;align-items:center;gap:6px}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45}
.bands{display:grid;gap:8px}
.band{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.band .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.band .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.band b{font-family:var(--f-mono);font-weight:500;text-align:right}
.overall{display:flex;align-items:baseline;gap:8px}
.overall b{font-family:var(--f-mono);font-size:34px;font-weight:500;line-height:1}
audio{width:100%;height:40px}

.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;list-style:none;margin:0}
.group .phr{padding:8px 0;border-top:1px solid var(--line)}
.group .phr:first-child{border-top:0}
.empty{font-size:13px;color:var(--muted);padding:10px 0}

.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.field select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.field small{font-size:12px;color:var(--muted)}
.steps{margin:0;padding-left:20px;font-size:13.5px;display:grid;gap:4px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.on{background:var(--good);color:#fff}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;border-radius:12px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
body.in-chat .tabs{display:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <div class="brand"><h1><span>Talk</span> Shop</h1></div>
    <div class="topr">
      <div class="streak" title="最近 7 天练习情况"><div class="dots" id="dots"></div><span><b id="streakN">0</b> 天</span></div>
      <button class="iconbtn" id="gear" aria-label="设置"><span data-i="gear"></span></button>
    </div>
  </header>
  <section id="v-practice"></section>
  <section id="v-chat" hidden></section>
  <section id="v-drill" hidden></section>
  <section id="v-phrases" hidden></section>
  <section id="v-settings" hidden></section>
</div>

<nav class="tabs" role="tablist">
  <div class="in">
    <button role="tab" data-tab="practice" aria-selected="true"><span data-i="chat"></span>情景对话</button>
    <button role="tab" data-tab="drill" aria-selected="false"><span data-i="timer"></span>60 秒挑战</button>
    <button role="tab" data-tab="phrases" aria-selected="false"><span data-i="book"></span>短语库</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- icons ---------- */
const ICONS={
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
  slow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  starOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4M9 2h6"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  rec:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
};
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ICONS[e.dataset.i]);

/* ---------- content ----------
   Each scenario: role, phrases, and a 3-turn script [their line, model answer]. */
const SCENARIOS=[
 {id:'intro',t:'项目启动会自我介绍',s:'30 秒讲清你是谁、负责什么',role:'Project lead',
  ph:[["I'm ___, and I look after ___ on the team.","我是___，在团队里负责___。"],["On this project, I'll mainly be focusing on ___.","这个项目里我主要负责___。"],["Before this, I worked on ___, so I've got some background in ___.","之前做过___，所以对___有些经验。"],["Feel free to reach out to me for anything related to ___.","有___相关的事随时找我。"]],
  script:[
   ["Great, let's go around the table. Could you briefly introduce yourself and what you'll be covering on this project?","Hi everyone, I'm Alex. I'm a market analyst on the data team, and on this project I'll mainly be looking after the sales forecasts. Feel free to reach out if you need any numbers."],
   ["Nice to meet you. Have you worked on anything similar before?","Yes, last year I worked on a similar forecasting project for a European client, so I've got some background in this. The main lesson was to agree on the data sources early."],
   ["That's useful. What do you need from the rest of us to get started?","Mainly two things. First, access to last year's sales data. And second, a quick call with whoever owns the product roadmap. If I can get those by Friday, I can share a first draft next week."]]},
 {id:'status',t:'周会进度汇报',s:'先结论，再细节，再风险',role:'Your manager',
  ph:[["Overall, we're on track.","总体进度正常。"],["The main thing this week was ___.","这周主要完成了___。"],["One thing I want to flag is ___.","有一点需要提醒大家：___。"],["Next week, I'm planning to ___.","下周计划___。"]],
  script:[
   ["Thanks for joining. Can you give us a quick update on where things are with your part of the project?","Sure. Overall, we're on track. The main thing this week was finishing the data cleaning. One thing I want to flag is a delay from one supplier, which might push the dashboard back by two days."],

const KEY='talkshop.v1';
let store={saved:[],days:[],done:{},voice:true,ai:{provider:'deepseek',base:'https://api.deepseek.com',model:'deepseek-chat',key:''}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){store=Object.assign(store,s);store.ai=Object.assign({provider:'deepseek',base:'https://api.deepseek.com',model:'deepseek-chat',key:''},s.ai||{})}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
function markPracticed(){const k=dayKey(Date.now());if(!store.days.includes(k))store.days.push(k);store.days=store.days.slice(-60);persist();renderStreak()}
function renderStreak(){
  const dots=document.getElementById('dots');dots.replaceChildren();
  for(let i=6;i>=0;i--){dots.append(h('i',{class:store.days.includes(dayKey(Date.now()-i*864e5))?'on':''}))}
  let n=0,i=store.days.includes(dayKey(Date.now()))?0:1;
  while(i<400&&store.days.includes(dayKey(Date.now()-i*864e5))){n++;i++}
  document.getElementById('streakN').textContent=n;
}
const aiOn=()=>!!(store.ai&&store.ai.key&&store.ai.base&&store.ai.model);
function isSaved(en){return store.saved.some(p=>p[0]===en)}
function toggleSave(en,zh){if(isSaved(en))store.saved=store.saved.filter(p=>p[0]!==en);else store.saved.unshift([en,zh||'']);persist();toast(isSaved(en)?'已收藏到短语库':'已取消收藏')}

/* ---------- helpers ---------- */
function h(tag,props,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const ico=n=>h('span',{html:ICONS[n],style:'display:contents'});
let toastT;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2000)}
const wc=s=>(s.trim().match(/[A-Za-z0-9'’-]+/g)||[]).length;
function starBtn(en,zh,cls){const b=h('button',{class:cls||'mini','aria-label':'收藏'});const draw=()=>{b.classList.toggle('starred',isSaved(en));b.replaceChildren(ico(isSaved(en)?'starOn':'star'));if(cls)b.append('收藏')};draw();b.addEventListener('click',()=>{toggleSave(en,zh);draw()});return b}

/* ---------- voice: text-to-speech ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){
  const en=voices.filter(v=>/^en[-_]/i.test(v.lang));
  const pref=[/Samantha/i,/Daniel/i,/Karen/i,/Serena/i,/Google US English/i,/Google UK English Female/i,/Microsoft (Aria|Jenny|Libby)/i];
  for(const p of pref){const v=en.find(v=>p.test(v.name));if(v)return v}
  return en.find(v=>/en[-_](US|GB)/i.test(v.lang))||en[0]||null;
}
function speak(text,slow){
  if(!('speechSynthesis' in window)){toast('这个浏览器不支持朗读');return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/_+/g,'something'));const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=slow?0.72:0.95;speechSynthesis.speak(u)}catch(e){toast('朗读失败')}
}

/* ---------- AI (optional, OpenAI-compatible endpoint) ---------- */
const PROVIDERS={
  deepseek:{name:'DeepSeek（推荐，国内可用）',base:'https://api.deepseek.com',model:'deepseek-chat',site:'https://platform.deepseek.com'},
  moonshot:{name:'Kimi / Moonshot',base:'https://api.moonshot.cn/v1',model:'moonshot-v1-8k',site:'https://platform.moonshot.cn'},
  custom:{name:'其他（OpenAI 兼容）',base:'',model:'',site:''}
};
async function aiJSON(prompt){
  const c=store.ai;const url=c.base.replace(/\/+$/,'')+'/chat/completions';
  let r;
  try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
    body:JSON.stringify({model:c.model,temperature:0.6,response_format:{type:'json_object'},
      messages:[{role:'system',content:'You are a helpful English speaking coach. Always answer with one valid JSON object and nothing else.'},{role:'user',content:prompt}]})})}
  catch(e){throw {code:'network'}}
  if(!r.ok){let msg='';try{msg=(await r.json()).error?.message||''}catch(e){}throw {code:'http',status:r.status,msg}}
  const j=await r.json();let t=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
  t=t.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)t=t.slice(a,b+1);
  try{return JSON.parse(t)}catch(e){throw {code:'parse'}}
}
function aiErr(e){
  if(e.code==='network')return '连不上 AI 服务。检查网络，或在设置里换一个服务商。';
  if(e.code==='parse')return 'AI 返回的格式不对，再发一次试试。';
  if(e.status===401)return 'API key 不对。去设置里重新粘贴一下。';
  if(e.status===402)return 'AI 账户余额不足，去服务商网站充值后再试。';
  if(e.status===429)return '请求太频繁或额度用完，稍等再试。';
  return 'AI 请求失败（'+(e.status||'')+'）'+(e.msg?'：'+e.msg:'');
}

/* ---------- composer (type / keyboard dictation / browser speech) ---------- */
function makeComposer({placeholder,onSend}){
  const ta=h('textarea',{rows:'1',placeholder,autocapitalize:'sentences',autocomplete:'off',spellcheck:'false'});
  const mic=h('button',{class:'mic','aria-label':'开始说'},ico('mic'));
  const send=h('button',{class:'send','aria-label':'发送',disabled:true},ico('send'));
  const left=h('span',{});const right=h('span',{class:'mono'});
  const el=h('div',{class:'composer'},h('div',{class:'box'},ta,mic,send),h('div',{class:'hint'},left,right));
  let rec=null,listening=false,base='',finals='',t0=0,ms=0,busy=false;
  const c={el,ta,
    reset(){stop();ta.value='';base=finals='';ms=0;fit();upd()},
    setBusy(b){busy=b;upd()},
    refresh(){mic.hidden=!srAvailable();left.textContent=srAvailable()?'点麦克风开口说，说完再点一次；也可以用键盘语音':'用手机键盘上的麦克风说英文，或直接打字'},
    stop
  };
  function stop(){if(rec&&listening){try{rec.stop()}catch(e){}}}
  function fit(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,160)+'px'}
  function upd(){const n=wc(ta.value);right.textContent=n?n+' words'+(ms>3000&&!listening?' · '+Math.round(n/(ms/60000))+' wpm':''):'';send.disabled=busy||listening||!ta.value.trim()}
  function setLive(on){listening=on;mic.classList.toggle('live',on);mic.replaceChildren(ico(on?'stop':'mic'));upd()}
  ta.addEventListener('input',()=>{base=ta.value;finals='';fit();upd()});
  mic.addEventListener('click',()=>{
    if(listening){stop();return}
    try{
      rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=true;
      base=ta.value?ta.value.replace(/\s*$/,' '):'';finals='';
      rec.onresult=ev=>{let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)finals+=r[0].transcript+' ';else interim+=r[0].transcript}
        ta.value=(base+finals+interim).trim();fit();upd()};
      rec.onerror=ev=>{const er=ev.error;
        if(er==='not-allowed'||er==='service-not-allowed'){toast('没有麦克风/语音识别权限，改用键盘上的语音输入吧');srBroken=true;refreshAll()}
        else if(er==='network'){toast('语音识别连不上网络，改用键盘上的语音输入吧');srBroken=true;refreshAll()}
        else if(er!=='no-speech'&&er!=='aborted')toast('语音识别出错：'+er)};
      rec.onend=()=>{if(listening){ms+=Date.now()-t0}setLive(false);base=ta.value;finals=''};

/* ---------- phrases ---------- */
function renderPhrases(){
  const vv=V.phrases;vv.replaceChildren();
  vv.append(h('p',{class:'muted',style:'margin:0 0 4px;font-size:13.5px'},'卡壳时最有用的不是单词，而是整句“救场句”。每天挑 3 句，听两遍、跟读三遍。'));
  vv.append(h('div',{class:'eyebrow'},'我的收藏 · '+store.saved.length));
  const mine=h('ul',{class:'group'});
  if(!store.saved.length)mine.append(h('li',{class:'empty'},'点任意短语或参考说法旁边的星星，就会存到这里。'));
  store.saved.forEach(p=>mine.append(phraseRow(p[0],p[1])));
  vv.append(mine);
  BANK.forEach(g=>{vv.append(h('div',{class:'eyebrow'},g.g));const ul=h('ul',{class:'group'});g.p.forEach(p=>ul.append(phraseRow(p[0],p[1])));vv.append(ul)});
}

/* ---------- settings ---------- */
function renderSettings(){
  const vv=V.settings;vv.replaceChildren();
  vv.append(h('div',{class:'chathead'},h('button',{class:'iconbtn','aria-label':'返回',onclick:()=>show('practice')},ico('back')),h('div',{class:'ttl'},h('h2',{},'设置'),h('div',{},'AI 点评（可选）'))));
  const c=store.ai;
  const sel=h('select',{id:'prov'});Object.entries(PROVIDERS).forEach(([k,p])=>{const o=h('option',{value:k},p.name);if(k===c.provider)o.selected=true;sel.append(o)});
  const base=h('input',{id:'base',type:'url',value:c.base,placeholder:'https://…',autocapitalize:'off',autocomplete:'off',spellcheck:'false'});
  const model=h('input',{id:'model',type:'text',value:c.model,autocapitalize:'off',autocomplete:'off',spellcheck:'false'});
  const key=h('input',{id:'key',type:'password',value:c.key,placeholder:'sk-…',autocapitalize:'off',autocomplete:'off',spellcheck:'false'});
  const status=h('span',{class:'pill'+(aiOn()?' on':'')},aiOn()?'已开启':'未开启');
  const advanced=h('div',{style:'display:grid;gap:12px'},h('div',{class:'field'},h('label',{for:'base'},'接口地址'),base),h('div',{class:'field'},h('label',{for:'model'},'模型名'),model));
  const siteLine=h('small',{});
  function syncProv(){const p=PROVIDERS[sel.value];if(sel.value!=='custom'){base.value=p.base;model.value=p.model}advanced.hidden=sel.value!=='custom';siteLine.textContent=p.site?'在 '+p.site+' 注册并创建 API key。':'填写 OpenAI 兼容接口的地址和模型名。'}
  sel.addEventListener('change',syncProv);
  const out=h('div',{class:'muted',style:'font-size:13px'});
  const save=h('button',{class:'btn primary'},'保存');
  const test=h('button',{class:'btn'},'测试一下');
  const clear=h('button',{class:'btn'},'关闭 AI');
  function collect(){store.ai={provider:sel.value,base:base.value.trim(),model:model.value.trim(),key:key.value.trim()};persist();status.textContent=aiOn()?'已开启':'未开启';status.classList.toggle('on',aiOn())}
  save.addEventListener('click',()=>{collect();toast(aiOn()?'已保存，AI 点评已开启':'已保存')});
  clear.addEventListener('click',()=>{key.value='';collect();toast('已关闭 AI，回到离线练习模式')});
  test.addEventListener('click',async()=>{collect();if(!aiOn()){out.textContent='先填好 API key。';return}
    test.disabled=true;out.textContent='正在连接…';
    try{const r=await aiJSON('Reply with {"ok": true, "msg": "a short friendly greeting in English"}');out.textContent='连接成功：'+(r.msg||'OK')}
    catch(e){out.textContent=aiErr(e)}finally{test.disabled=false}});
  vv.append(h('div',{class:'card',style:'margin-top:8px'},
    h('div',{class:'row',style:'justify-content:space-between'},h('h3',{style:'font-size:16px'},'AI 改错和打分'),status),
    h('p',{class:'muted',style:'margin:0;font-size:13.5px'},'不填也能正常练习。填了之后，每句回答都会得到改错、更地道的说法，对话会跟着你的回答走，60 秒挑战也能打分。'),
    h('ol',{class:'steps'},h('li',{},'打开 DeepSeek 开放平台（platform.deepseek.com），用手机号注册'),h('li',{},'充一点钱，10 块钱够练很久'),h('li',{},'在“API keys”里新建一个 key，复制'),h('li',{},'粘贴到下面，点保存，再点“测试一下”')),
    h('div',{class:'field'},h('label',{for:'prov'},'服务商'),sel,siteLine),
    advanced,
    h('div',{class:'field'},h('label',{for:'key'},'API key'),key,h('small',{},'key 只保存在这台手机的浏览器里，只会发给你选的服务商。')),
    h('div',{class:'btnrow'},save,test,clear),out));
  vv.append(h('div',{class:'card',style:'margin-top:12px'},h('h3',{style:'font-size:16px'},'语音小贴士'),
    h('ul',{class:'checklist'},
      h('li',{},'iPhone：点输入框，用键盘右下角的麦克风说英文。键盘语言要切到 English，识别才准。'),
      h('li',{},'朗读声音来自手机系统。iPhone 可以在 设置 → 辅助功能 → 朗读内容 → 声音 里下载更自然的英文语音（比如 Samantha 增强版）。'),
      h('li',{},'加到主屏幕：Safari 点分享 → 添加到主屏幕，以后像 App 一样打开。'))));
  syncProv();
}

/* ---------- boot ---------- */
renderStreak();renderPractice();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
